<!doctype html>
<html lang="en">
  {{ partial "head.html" . }}
<body>
  <a class="skip-link" href="#main">Skip to main</a>

  {{ partial "header.html" . }}

  <main id="main">
    <div class="content">
      <h1>{{ .Title }}</h1>
      {{ .Content }}
      <ul class="post-list">
        {{ range .Pages }}
        <li>
          <a href="{{ .Permalink }}" title="{{ .Title }}">{{ .Title }}</a>
          <span class="leader" aria-hidden="true"></span>
          <time datetime="{{ dateFormat "2006-01-02" .Date }}">{{ dateFormat "Jan 2, 2006" .Date }}</time>
        </li>
        {{ end }}
      </ul>
    </div>
  </main>

  {{ partial "footer.html" . }}
</body>
</html>
