<header class="site-header">
  <div class="site-header__row">
    <a class="brand" href="{{ .Site.BaseURL }}">{{ .Site.Title }}<span class="cursor" aria-hidden="true">&#9646;</span></a>
    <nav class="site-nav">
      <ul>
        {{ $currentPage := . }}
        {{ range .Site.Menus.main }}
        <li class="{{ if $currentPage.HasMenuCurrent "main" . }}active{{ end }}">
          <a href="{{ .URL }}"{{ if .Params.external }} target="_blank" rel="noopener"{{ end }}>{{ .Name }}</a>
        </li>
        {{ end }}
      </ul>
    </nav>
  </div>
  <hr class="rule">
</header>
