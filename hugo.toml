baseURL = 'https://naterthought.com/'
languageCode = 'en-us'
title = 'Nathan Johnson'
theme = 'maverick'

[permalinks]
  pages = "/:slug"

[params]
  logo = '/assets/favicon.ico'
  description = "#1 git hater"
  author = 'Nathan Johnson'
  items = 10
  marquee = "★ WELCOME TO NATE'S CORNER OF THE INTERNET ★ THANKS FOR STOPPING BY ★ BEST VIEWED AT 800x600 ★ UNDER CONSTRUCTION SINCE FOREVER ★ SIGN THE GUESTBOOK ★"

  [params.comments]
    enabled = true
    githubRepo = 'canhtran/maverick'
    theme = 'github-light'


[menu]
  [[menu.main]]
    identifier = "about"
    name = "About Me"
    url = "/about/"
    weight = -110
  [[menu.main]]
    identifier = "posts"
    name = "Blog"
    url = "/posts/"
    weight = -100
  [[menu.main]]
    identifier = "instagram"
    name = "Instagram"
    url = "https://www.instagram.com/naterthought/"
    weight = -90
    [menu.main.params]
      external = true
  [[menu.main]]
    identifier = "linkedin"
    name = "LinkedIn"
    url = "https://www.linkedin.com/in/nathan-johnson-705656287/"
    weight = -80
    [menu.main.params]
      external = true
  [[menu.main]]
    identifier = "scholar"
    name = "Google Scholar"
    url = "https://scholar.google.com/citations?user=MNdLZfwAAAAJ&hl=en"
    weight = -70
    [menu.main.params]
      external = true

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    anchorLineNos = false
    codeFences = true
    guessSyntax = false
    hl_Lines = ''
    hl_inline = false
    lineAnchors = ''
    lineNoStart = 1
    lineNos = false
    lineNumbersInTable = true
    noClasses = true
    noHl = false
    style = 'monokailight'
    tabWidth = 4

[taxonomies]
  tag = "tags"

[outputs]
  home = ["HTML", "RSS", "JSON"]
  section = ["HTML"]

[outputFormats.RSS]
  mediatype = "application/rss"
  baseName = "atom"

[outputFormats.JSON]
  mediatype = "application/json"
  baseName = "feed"

ignoreErrors = ["error-remote-getjson"]
